  <!-- סרט -->
  <path d="M14 288l30-12v52l-30-12z" fill="#B0761C"/>
  <path d="M286 288l-30-12v52l30-12z" fill="#B0761C"/>
  <path d="M46 276h208c7 0 12 5 12 12v20c0 7-5 12-12 12H46c-7 0-12-5-12-12v-20c0-7 5-12 12-12z"
