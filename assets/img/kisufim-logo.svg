      <stop offset="30%"  stop-color="#DC5C0A"/>
      <stop offset="62%"  stop-color="#F2941B"/>
      <stop offset="100%" stop-color="#FFDA6B"/>
    </linearGradient>
    <radialGradient id="kf-core" cx="50%" cy="66%" r="58%">
