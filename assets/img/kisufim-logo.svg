<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" role="img" aria-label="כיסופים לרבינו">
  <title>כיסופים לרבינו</title>
  <defs>
    <linearGradient id="kf-flame" x1="0" y1="1" x2="0" y2="0">
