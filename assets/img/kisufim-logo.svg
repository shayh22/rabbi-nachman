  <!-- לשונות אש -->
  <path d="M104 92c-14 20-22 44-18 64 3 15 11 25 11 25s-17-8-25-25c-9-20-3-48 32-64z" fill="#FFE083" opacity=".7"/>
  <path d="M196 92c14 20 22 44 18 64-3 15-11 25-11 25s17-8 25-25c9-20 3-48-32-64z" fill="#FFE083" opacity=".7"/>

  <!-- כיסופים -->
  <text x="150" y="232" text-anchor="middle" textLength="176" lengthAdjust="spacingAndGlyphs"
